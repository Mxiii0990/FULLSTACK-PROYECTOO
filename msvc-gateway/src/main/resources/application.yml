- id: cpu-service
    uri: lb://cpu-service
    predicates:
      - Path=/api/v1/cpus,/api/v1/cpus/**,/api/v2/cpus,/api/v2/cpus/**
    - id: gpu-service
      uri: lb://gpu-service
      predicates:
        - Path=/api/v1/gpus,/api/v1/gpus/**,/api/v2/gpus,/api/v2/gpus/**
    - id: motherboard-service
      uri: lb://motherboard-service
      predicates:
        - Path=/api/v1/motherboards,/api/v1/motherboards/**,/api/v2/motherboards,/api/v2/motherboards/**
    - id: ram-service
      uri: lb://ram-service
      predicates:
        - Path=/api/v1/rams,/api/v1/rams/**,/api/v2/rams,/api/v2/rams/**
    - id: storage-service
      uri: lb://storage-service
      predicates:
        - Path=/api/v1/storages,/api/v1/storages/**,/api/v2/storages,/api/v2/storages/**
    - id: psu-service
      uri: lb://psu-service
      predicates:
        - Path=/api/v1/psus,/api/v1/psus/**,/api/v2/psus,/api/v2/psus/**